name: Build APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        app:
          - sender
          - receiver

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare fonts directory
        run: mkdir -p "${{ matrix.app }}/fonts"

      - name: Build APK
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: ${{ matrix.app }}
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ matrix.app }}/bin/*.apk
          if-no-files-found: error
