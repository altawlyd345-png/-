name: Build APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        app: [sender, receiver]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare font directory
        run: |
          mkdir -p ${{ matrix.app }}/fonts
          curl -fL -o ${{ matrix.app }}/fonts/NotoNaskhArabic-Regular.ttf \
            https://github.com/notofonts/notofonts.github.io/raw/main/fonts/NotoNaskhArabic/hinted/ttf/NotoNaskhArabic-Regular.ttf || true

      - name: Build APK
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: ${{ matrix.app }}
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ matrix.app }}/bin/*.apk
          if-no-files-found: error
